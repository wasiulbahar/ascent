<meta charset="utf-8">
<title>Ascent Path Drafts</title>
<link rel="icon" href="../icons/favicon-32.png" type="image/png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* Layout: one reading column. Header, sticky section pills, About with trivia and a life timeline, then each stage as a pastel band with an illustrated header and expandable work cards. */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --ink:#23222F; --muted:#6B6A7B; --line:#E2E0EC;
  --mint:#DDF2E6; --mint-ink:#1F5A3A; --lilac:#E6E1FB; --lilac-ink:#3B2F86; --peach:#FDE6DA; --peach-ink:#7A3518;
  --sky:#DCEBFA; --sky-ink:#1D4673; --butter:#FBF0CF; --butter-ink:#6B4E0B; --rose:#F9E0E8; --rose-ink:#7A2443;
  --flag:#FFE7A3; --flag-ink:#5E4300;
  --display:"Outfit","Segoe UI",system-ui,sans-serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --read:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15141C; --surface:#1F1E29; --ink:#EDECF5; --muted:#A3A2B5; --line:#33323F;
  --mint:#1D3A2B; --mint-ink:#BDE8CF; --lilac:#2B2650; --lilac-ink:#D3CCFA; --peach:#43271B; --peach-ink:#F7CDB8;
  --sky:#1B2F47; --sky-ink:#C2DBF5; --butter:#3A3016; --butter-ink:#F2DE9F; --rose:#41212D; --rose-ink:#F3C3D3;
  --flag:#4A3A10; --flag-ink:#FFE08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141C; --surface:#1F1E29; --ink:#EDECF5; --muted:#A3A2B5; --line:#33323F;
  --mint:#1D3A2B; --mint-ink:#BDE8CF; --lilac:#2B2650; --lilac-ink:#D3CCFA; --peach:#43271B; --peach-ink:#F7CDB8;
  --sky:#1B2F47; --sky-ink:#C2DBF5; --butter:#3A3016; --butter-ink:#F2DE9F; --rose:#41212D; --rose-ink:#F3C3D3;
  --flag:#4A3A10; --flag-ink:#FFE08A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--lilac-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--lilac-ink);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{padding-block:36px 20px;display:grid;gap:14px}
.brandline{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px}
header h1{font-size:clamp(36px,7vw,52px);line-height:1.05}
.lede{font-family:var(--read);font-size:19px;line-height:1.55;max-width:60ch}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pill.draft{background:var(--butter);color:var(--butter-ink);border-color:transparent}
.pill.flag{background:var(--flag);color:var(--flag-ink);border-color:transparent}
.switch{display:flex;flex-wrap:wrap;gap:8px}
.switch a{text-decoration:none;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.switch a[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.note{background:var(--surface);border-radius:16px;padding:14px 16px;font-size:15px;border:1px solid var(--line)}

nav.stagenav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
nav.stagenav .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
nav.stagenav .wrap::-webkit-scrollbar{display:none}
nav.stagenav .jump{flex:none;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
nav.stagenav .jump.st{border-color:transparent}
nav.stagenav #toggleAll{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}

main{padding-block:24px 80px;display:grid;gap:28px}
section{scroll-margin-top:70px}
.stage{border-radius:28px;padding:22px;display:grid;gap:16px}
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.shead .lvl{font-size:13px;font-weight:700;opacity:.85}
.shead h2{font-size:clamp(24px,4vw,30px)}
.shead .intent{font-family:var(--read);font-size:17px}
.art{width:84px;height:84px;border-radius:26px;background:var(--surface);display:grid;place-items:center}
.art svg.i{width:42px;height:42px;stroke-width:1.6}
.sintro{font-family:var(--read);font-size:17px;line-height:1.65;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 18px}
.gate{background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.gate b{white-space:nowrap}
.works{display:grid;gap:12px}

details.work{background:var(--surface);color:var(--ink);border-radius:20px}
details.work>summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:44px minmax(0,1fr) auto 20px;gap:12px;align-items:center}
.donebtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.donebtn .box{width:16px;height:16px;border-radius:5px;border:2px solid currentColor;display:grid;place-items:center}
.donebtn[aria-pressed="true"]{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink)}
.donebtn[aria-pressed="true"] .box{background:currentColor}
.donebtn[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border:2px solid var(--mint);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
details.work.isdone{box-shadow:inset 0 0 0 2px var(--mint-ink)}
.stagecount{font-weight:700}
a.pathlink{font-weight:700;color:var(--lilac-ink);text-decoration:none;border-bottom:2px solid var(--lilac);white-space:nowrap}
a.pathlink::after{content:" →"}
@media (max-width:520px){.donebtn .lbl{display:none}}
details.work>summary::-webkit-details-marker{display:none}
.wi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.wt h3{font-size:19px;line-height:1.25}
.wt .meta{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.chev{transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.wbody{padding:0 16px 18px;display:grid;gap:12px}
.edition{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.edition b{color:var(--ink)}
.layer{border-radius:16px;padding:14px 16px;display:grid;gap:8px;border:1px solid var(--line);min-width:0}
.layer .tag{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.txt{font-family:var(--read);font-size:16.5px;line-height:1.6;min-width:0;overflow-wrap:anywhere;display:grid;gap:10px}
.txt ol,.txt ul{margin:0;padding-left:22px;display:grid;gap:6px}
.txt strong{font-family:var(--body);font-weight:700}
.txt h3{font-size:19px;margin-top:6px}
.extra{font-family:var(--read);font-size:16px}
.extra ul{margin:0;padding-left:22px;display:grid;gap:6px}
.verify{background:var(--flag);color:var(--flag-ink);font-family:var(--body);font-size:13px;font-weight:700;padding:1px 8px;border-radius:6px}

/* images with captions: a paragraph holding an image and its italic credit */
.txt p:has(> img){display:grid;gap:8px;font-family:var(--body);font-size:13px;line-height:1.5;color:var(--muted)}
.txt p:has(> img) img{display:block;width:auto;max-width:100%;max-height:380px;height:auto;border-radius:16px;background:var(--line)}
@media (min-width:700px){
  .endblock.about .txt{grid-template-columns:minmax(0,280px) minmax(0,1fr);column-gap:22px;align-items:start}
  .endblock.about .txt>*{grid-column:1/-1}
  .endblock.about .txt>p:has(> img){grid-column:1;grid-row:1}
  .endblock.about .txt>p:has(> img)+p{grid-column:2;grid-row:1;font-size:18px;line-height:1.7}
}
/* access badges */
.acc{display:inline-block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:3px;white-space:nowrap}
.acc.free{background:var(--mint);color:var(--mint-ink)}
.acc.mixed{background:var(--sky);color:var(--sky-ink)}
.acc.paid{background:var(--rose);color:var(--rose-ink)}
.accnote{font-size:14px;color:var(--muted)}
.accnote b{color:var(--ink)}
/* playable quiz */
.quiz{display:grid;gap:14px;font-family:var(--body)}
.qq{display:grid;gap:8px}
.qq .kind{font-size:12px;font-weight:700;color:var(--peach-ink);text-transform:uppercase;letter-spacing:.04em}
.qq .qt{font-size:16px;font-weight:600;line-height:1.5}
.qq .opts{display:grid;gap:6px}
.qq .opts button{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px;font-weight:600;color:var(--ink)}
.qq .opts button:hover:not(:disabled){border-color:var(--peach-ink)}
.qq .opts button.right{background:var(--mint);border-color:var(--mint-ink);color:var(--mint-ink)}
.qq .opts button.wrong{border-color:var(--rose-ink);color:var(--rose-ink)}
.qq .opts button:disabled{cursor:default}
.qq input{font:inherit;font-weight:600;width:9em;max-width:100%;padding:3px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.qq input.right{border-color:var(--mint-ink);background:var(--mint)}
.qq input.wrong{border-color:var(--rose-ink)}
.qq .go{margin-left:6px;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:4px 10px;font-weight:700;font-size:14px}
.qq .fb{font-size:14px;line-height:1.5;border-radius:10px;padding:8px 12px}
.qq .fb.ok{background:var(--mint);color:var(--mint-ink)}
.qq .fb.no{background:var(--rose);color:var(--rose-ink)}
.score{border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--bg);display:grid;gap:8px}
.score.pass{background:var(--mint);color:var(--mint-ink)}
.score.fail{background:var(--butter);color:var(--butter-ink)}
.score .row{display:flex;gap:8px;flex-wrap:wrap}
.score button{border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;background:var(--surface);color:var(--ink)}
/* trivia + timeline */
.trivia-h{font-family:var(--display)!important;font-weight:600;font-size:15px;color:var(--butter-ink);margin-top:4px}
ul.trivia{list-style:none;padding:0;display:grid;gap:8px}
ul.trivia li{position:relative;background:var(--butter);color:var(--butter-ink);border-radius:14px;padding:10px 14px 10px 40px;font-family:var(--body);font-size:15px;line-height:1.5}
ul.trivia li::before{content:"";position:absolute;left:14px;top:13px;width:15px;height:15px;background:currentColor;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
ul.timeline{list-style:none;padding:0 0 0 22px;margin:4px 0 0 8px;border-left:3px solid var(--line);display:grid;gap:4px}
ul.timeline li{position:relative;padding:2px 0 8px;font-family:var(--body);font-size:15px}
ul.timeline li::before{content:"";position:absolute;left:-31px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--lilac);border:3px solid var(--lilac-ink)}
ul.timeline li strong{display:block;font-family:var(--display);font-weight:600;font-size:19px;color:var(--lilac-ink)}

.endblock{background:var(--surface);border-radius:24px;padding:22px;display:grid;gap:12px;border:1px solid var(--line)}
.endblock.about{border:0;background:var(--lilac);color:var(--lilac-ink)}
.endblock.about .txt{color:var(--ink);background:var(--surface);border-radius:18px;padding:18px}
.endblock.mastery{border:2px solid var(--mint-ink)}
.endblock h2{font-size:24px}
.endblock li:has(input){list-style:none;margin-left:-22px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:var(--body);font-size:15px;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.status{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:520px){.stage{padding:16px;border-radius:22px} .art{width:60px;height:60px;border-radius:18px} .art svg.i{width:30px;height:30px} details.work>summary{padding:14px} .wbody{padding:0 12px 14px}}
</style>

<header class="wrap">
  <div class="brandline"><svg class="i" viewBox="0 0 24 24" style="color:var(--lilac-ink)"><path d="M3 20l6-8 4 4 8-11"/></svg>Ascent · path drafts for review</div>
  <div class="switch" id="switch" role="group" aria-label="Choose a path"></div>
  <h1 id="title">Loading…</h1>
  <p class="lede" id="lede"></p>
  <div class="pills" id="pills"></div>
  <div class="note" id="note"></div>
</header>
<nav class="stagenav" aria-label="Sections"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="main"><p class="status">Loading the path…</p></main>

<script>
const STAGE_COLORS=["mint","lilac","peach","sky","butter","rose"];
const LAYERS={Introduction:["mint","Introduction"],Hook:["mint","Introduction"],Understand:["sky","Understand"],Analyse:["lilac","Analyse"],Scholar:["butter","Scholar"],Quiz:["peach","Quiz"],Check:["peach","Quiz"]};
const ACCESS={free:["free","Free"],"free-and-paid":["mixed","Free + paid"],paid:["paid","Paid"]};
const ICONS={read:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  watch:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M10 9l4 2-4 2z"/>',
  course:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  listen:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>'};
const STAGE_ART=['<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18"/><circle cx="14.5" cy="12" r=".9"/>',
  '<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  '<path d="M3 20l6-11 4 6 3-4 5 9z"/>',
  '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',
  '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/>'];
const ico=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS.read}</svg>`;
const vf=s=>s.replace(/(<code>)?\[verify(?::\s*([^\]]*))?\]/g,(all,code,t)=>code?all:`<span class="verify">Check: ${t||"needs expert confirmation"}</span>`);
const md=s=>vf(marked.parse(s.trim()));
const C=c=>`background:var(--${c});color:var(--${c}-ink)`;
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* published: files sit beside the page; local copy: page is in review/, so step up one folder */
let BASE="";
/* every path draft this page can show; the hash picks one (#dostoevsky, #classical-music) */
const PATHS=[["dostoevsky","Dostoevsky"],["classical-music","Classical music"],["geopolitics","Geopolitics"],["philosophy","Philosophy"],["economics","Economics"],["history","History"],["physics","Physics"],["mathematics","Mathematics"],["biology","Biology"],["chemistry","Chemistry"],["psychology","Psychology"],["computer-science","Computer science"],["literature","Literature"],["sociology","Sociology"],["law","Law"],["medicine","Medicine and health"],["business","Business and management"],["education","Education"],["art-history","Art history"],["environment","Environmental science and climate"],["engineering","Engineering"],["political-science","Political science"],["linguistics","Linguistics"],["anthropology","Anthropology"],["music-theory","Music theory"],["astronomy","Astronomy"],["statistics","Statistics"],["architecture","Architecture"],["religion","Religion"],["archaeology","Archaeology"],["geography","Geography"],["earth-sciences","Earth sciences"],["artificial-intelligence","Artificial intelligence"],["journalism","Journalism and media"],["theatre","Theatre"],["neuroscience","Neuroscience"],["design","Design"],["international-relations","International relations"],["nutrition","Nutrition"],["popular-music","Popular and world music"],["classics","Classics: Greece and Rome"],["creative-writing","Creative writing"],["criminology","Criminology"],["finance","Finance"],["photography","Photography"],["human-rights","Human rights"],["gender-studies","Gender studies"],["nursing","Nursing"],["game-design","Game design"],["african-studies","African studies"],["film","Film"]];
const current=()=>PATHS.find(p=>p[0]===location.hash.slice(1))?.[0]||PATHS[0][0];
async function load(slug){
  for(const [u,b] of [[slug+".md",""],["../paths/"+slug+".md","../"]]){try{const r=await fetch(u);if(r.ok){BASE=b;return await r.text()}}catch(e){}}
  throw new Error("The path file could not be loaded.");
}

function metaOf(lines){const m={};for(const l of lines){const s=l.replace(/^-\s*/,"");
  if(/^id:/.test(s)){s.split(" · ").forEach(p=>{const i=p.indexOf(":");m[p.slice(0,i).trim()]=p.slice(i+1).trim()})}
  else{const i=s.indexOf(":");if(i>0)m[s.slice(0,i).trim()]=s.slice(i+1).trim()}}return m}

function renderWork(chunk,color,open){
  const [titleLine,...rest]=chunk.split("\n");
  const parts=rest.join("\n").split(/^### /m);const head=parts.shift();
  const m=metaOf(head.split("\n").filter(l=>/^- /.test(l)));
  const gates=[],layers=[];
  parts.forEach(p=>{const [h,...b]=p.split("\n");const name=h.trim(),txt=b.join("\n");(LAYERS[name]?layers:gates).push([name,txt])});
  const metaBits=[m.type&&({read:"Read",watch:"Watch",listen:"Listen"}[m.type]||m.type),m.creator,m.year,m.length,m.English&&("English: "+m.English)].filter(Boolean).join(" · ");
  const extras=Object.entries(m).filter(([k])=>!["id","type","year","length","creator","edition","English","access"].includes(k));
  const [accKey,accNote]=(m.access||"").split("|").map(s=>s.trim());const acc=ACCESS[accKey];
  const verb={read:"Read",listen:"Listened",watch:"Watched"}[m.type]||"Done";
  return {gates,html:`<details class="work" data-id="${m.id||""}" ${open?"open":""}>
    <summary><span class="wi" style="${C(color)}">${ico(m.type)}</span><span class="wt"><h3>${titleLine.trim()}${acc?`<span class="acc ${acc[0]}">${acc[1]}</span>`:""}</h3><span class="meta">${vf(metaBits)}</span></span>
      ${m.id?`<button type="button" class="donebtn" data-done="${m.id}" aria-pressed="false" aria-label="Mark ${titleLine.trim().replace(/"/g,"")} as ${verb.toLowerCase()}"><span class="box"></span><span class="lbl">${verb}</span></button>`:"<span></span>"}
      ${ico("chev").replace('class="i"','class="i chev"')}</summary>
    <div class="wbody">
      ${m.edition?`<p class="edition"><b>Edition:</b> ${md(m.edition).replace(/^<p>|<\/p>\s*$/g,"")}</p>`:""}
      ${acc&&accNote?`<p class="accnote"><b>Where to get it:</b> ${vf(accNote)}</p>`:""}
      ${extras.length?`<div class="extra">${md(extras.map(([k,v])=>`- **${k[0].toUpperCase()+k.slice(1)}:** ${v}`).join("\n"))}</div>`:""}
      ${layers.map(([n,t])=>`<section class="layer${LAYERS[n][1]==="Quiz"?" haskquiz":""}"><span class="tag" style="${C(LAYERS[n][0])}">${LAYERS[n][1]}</span><div class="txt">${md(LAYERS[n][1]==="Quiz"?t.replace(/_{3,}/g,"⟦blank⟧"):t)}</div></section>`).join("")}
    </div></details>`};
}

function renderStage(s,i,nav){
  const color=STAGE_COLORS[i%STAGE_COLORS.length];
  const [title,...rest]=s.split("\n");
  const [head,...works]=rest.join("\n").split(/^## /m);
  const meta={},intro=[];
  head.split("\n").forEach(l=>{const mm=l.match(/^(level|intent|gate):\s*(.*)$/);if(mm)meta[mm[1]]=mm[2];else intro.push(l)});
  const id="stage-"+(i+1),name=title.replace(/^Stage \d+:\s*/,"");
  nav.push(`<button type="button" class="jump st" data-target="${id}" style="${C(color)}">${i+1} · ${name}</button>`);
  let gateExtra="";
  const worksHtml=works.map((w,k)=>{const r=renderWork(w,color,i===0&&k===0);
    r.gates.forEach(([n,t])=>gateExtra+=`<section class="layer" style="background:var(--surface);color:var(--ink)"><span class="tag" style="${C(color)}">${n}</span><div class="txt">${md(t)}</div></section>`);return r.html}).join("");
  const introTxt=intro.join("\n").trim();
  return `<section class="stage" id="${id}" style="${C(color)}">
    <div class="shead"><div style="display:grid;gap:6px"><span class="lvl">Stage ${i+1} · Level: ${meta.level||""} · <span class="stagecount" data-stage="${id}"></span></span><h2>${name}</h2><p class="intent">${meta.intent||""}</p></div>
      <div class="art"><svg class="i" viewBox="0 0 24 24" aria-hidden="true">${STAGE_ART[i%STAGE_ART.length]}</svg></div></div>
    ${introTxt?`<div class="sintro">${md(introTxt)}</div>`:""}
    ${meta.gate?`<div class="gate"><b>To pass:</b><span>${meta.gate.replace(/`([^`]+)`/g,"$1")}</span></div>`:""}
    <div class="works">${worksHtml}</div>${gateExtra}</section>`;
}

/* Turn each Quiz layer's markdown (bold label + options with ✓, or a sentence with ⟦blank⟧ and [answer: x]) into a playable quiz with a 70% pass mark. */
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
function buildQuiz(txt){
  const kids=[...txt.children],qs=[];
  kids.forEach((el,i)=>{
    const label=el.tagName==="P"&&el.firstElementChild?.tagName==="STRONG"?el.firstElementChild.textContent.trim():"";
    const next=kids[i+1];
    if(label==="Multiple choice."&&next?.tagName==="UL"){
      // the explanation may follow the list, or (with no blank line) end up inside the last option
      let why=kids[i+2]?.tagName==="BLOCKQUOTE"?kids[i+2].innerHTML:"";
      const opts=[...next.children].map(li=>{const c=li.cloneNode(true);const inner=c.querySelector("blockquote");
        if(inner){why=inner.innerHTML;inner.remove()}return {html:c.innerHTML.replace("✓","").trim(),ok:li.textContent.includes("✓")}});
      for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]} // written correct-first
      qs.push({kind:"Multiple choice",q:el.innerHTML.replace(/^<strong>[^<]*<\/strong>\s*/,""),opts,why});
    }else if(label==="Fill in the blank."){
      const m=el.innerHTML.match(/\[answer:\s*([^\]]+)\]/);if(!m)return;
      const bq=next?.tagName==="BLOCKQUOTE"?next:null;
      qs.push({kind:"Fill in the blank",q:el.innerHTML.replace(/^<strong>[^<]*<\/strong>\s*/,"").replace(m[0],"").trim(),answers:m[1].split("/").filter(x=>!/^\s*-?\d+(\.\d+)?\s*$/.test(x)).map(norm),shown:m[1].split("/")[0].trim(),num:/^\s*-?\d+(\.\d+)?\s*$/.test(m[1].split("/")[0])?Number(m[1].split("/")[0]):null,why:bq?bq.innerHTML:""});
    }
  });
  if(!qs.length)return;
  const box=document.createElement("div");box.className="quiz";txt.replaceWith(box);
  let right=0,done=0;
  const score=document.createElement("div");score.className="score";
  const update=()=>{const pct=Math.round(right/qs.length*100);
    if(done<qs.length){score.className="score";score.textContent=`${done} of ${qs.length} answered · pass mark 70%`;return}
    const pass=pct>=70;score.className="score "+(pass?"pass":"fail");
    score.innerHTML=pass?`<span>${right} of ${qs.length} right (${pct}%). Passed: this work is collected.</span>`
      :`<span>${right} of ${qs.length} right (${pct}%). You haven't finished this work properly yet.</span><span style="font-weight:400">You can retry the quiz, or continue anyway. If you continue, this work and its stage stay marked "Not finished" until you come back and pass.</span><div class="row"><button type="button" data-retry>Retry the quiz</button><button type="button" data-skip>Continue anyway</button></div>`;
    score.querySelector("[data-retry]")?.addEventListener("click",()=>{const fresh=document.createElement("div");fresh.className="txt";fresh.innerHTML=box.dataset.src;box.replaceWith(fresh);buildQuiz(fresh)});
    score.querySelector("[data-skip]")?.addEventListener("click",()=>{score.innerHTML=`<span>Marked "Not finished". You can come back to this quiz at any time.</span>`});
  };
  box.dataset.src=kids.map(k=>k.outerHTML).join("");
  qs.forEach(q=>{
    const d=document.createElement("div");d.className="qq";
    const fb=document.createElement("div");fb.className="fb";fb.hidden=true;
    const answer=(ok,correctText)=>{done++;if(ok)right++;fb.hidden=false;fb.className="fb "+(ok?"ok":"no");
      fb.innerHTML=(ok?"Right. ":`Not quite. The answer is ${correctText}. `)+(q.why.replace(/<\/?p>/g," ")||"");update()};
    if(q.kind==="Multiple choice"){
      d.innerHTML=`<span class="kind">${q.kind}</span><div class="qt">${q.q.replace(/<\/?p>/g,"")}</div><div class="opts"></div>`;
      const opts=d.querySelector(".opts");
      q.opts.forEach(o=>{const b=document.createElement("button");b.type="button";b.innerHTML=o.html;opts.append(b);
        b.addEventListener("click",()=>{opts.querySelectorAll("button").forEach((x,k)=>{x.disabled=true;if(q.opts[k].ok)x.classList.add("right")});
          if(!o.ok)b.classList.add("wrong");answer(o.ok,`“${q.opts.find(x=>x.ok).html}”`)})});
    }else{
      d.innerHTML=`<span class="kind">${q.kind}</span><div class="qt">${q.q.replace("⟦blank⟧",'<input type="text" aria-label="Your answer" autocomplete="off">')}<button type="button" class="go">Check</button></div>`;
      const inp=d.querySelector("input"),go=d.querySelector(".go");
      const check=()=>{if(!inp.value.trim()){inp.focus();return}const ok=q.answers.includes(norm(inp.value))||(q.num!==null&&parseFloat(inp.value.replace(/,/g,""))===q.num);
        inp.disabled=go.disabled=true;inp.classList.add(ok?"right":"wrong");answer(ok,`“${q.shown}”`)};
      go.addEventListener("click",check);inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
    }
    d.append(fb);box.append(d);
  });
  box.append(score);update();
}

function enhance(root){
  root.querySelectorAll(".haskquiz .txt").forEach(buildQuiz);
  root.querySelectorAll("img").forEach(im=>{const s=im.getAttribute("src");if(!/^(https?:|data:|\/)/.test(s))im.src=BASE+s;im.loading="lazy";im.decoding="async"});
  root.querySelectorAll("p").forEach(p=>{const n=p.nextElementSibling;
    if(p.textContent.trim()==="Trivia"&&n&&n.tagName==="UL"){p.textContent="Did you know?";p.classList.add("trivia-h");n.classList.add("trivia")}});
  root.querySelectorAll("h3").forEach(h=>{const n=h.nextElementSibling;
    if(/life in dates|timeline/i.test(h.textContent)&&n&&n.tagName==="UL")n.classList.add("timeline")});
}

function render(src){
  src=src.replace(/\r\n/g,"\n");
  const fm={};src=src.replace(/^---\n([\s\S]*?)\n---\n/,(_,b)=>{b.split("\n").forEach(l=>{const i=l.indexOf(":");if(i>0)fm[l.slice(0,i).trim()]=l.slice(i+1).trim()});return ""});
  src=src.replace(/^---\s*$/gm,"");
  const chunks=src.split(/^# /m).map(s=>s.trim()).filter(Boolean);
  const intro=chunks.shift();const paras=intro.split("\n").slice(1).join("\n").trim().split(/\n\s*\n/);
  document.getElementById("title").textContent=intro.split("\n")[0];
  document.getElementById("lede").textContent=paras[0];
  document.getElementById("note").innerHTML=md(paras.slice(1).join("\n\n"));

  const nav=[];let html="",si=0,works=0;
  chunks.forEach(c=>{
    if(/^Stage \d/.test(c)){works+=(c.match(/^## /gm)||[]).length;html+=renderStage(c,si++,nav);return}
    const [t,...b]=c.split("\n");const id=slug(t);
    const cls=/^About/.test(t)?"about":/mastery/i.test(t)?"mastery":"";
    if(cls)nav.push(`<button type="button" class="jump" data-target="${id}">${cls==="about"?"About":"Mastery check"}</button>`);
    if(/^What you will/.test(t))nav.push(`<button type="button" class="jump" data-target="${id}">Goals</button>`);
    html+=`<section class="endblock ${cls}" id="${id}"><h2>${t}</h2><div class="txt ${/\|/.test(b.join("\n"))?"tablewrap":""}">${md(b.join("\n"))}</div></section>`;
  });
  nav.push(`<button type="button" id="toggleAll">Expand all</button>`);
  document.getElementById("nav").innerHTML=nav.join("");
  const main=document.getElementById("main");main.innerHTML=html;enhance(main);linkPaths(main);
  const flags=main.querySelectorAll(".verify").length;
  document.getElementById("pills").innerHTML=`<span class="pill draft">Draft · version ${fm.version||1}</span><span class="pill" id="progress"></span><span class="pill">${si} stages</span><span class="pill flag">${ico("flag")}${flags} facts to check</span>${fm.drafted?`<span class="pill">Drafted ${fm.drafted}</span>`:""}`;
  paintDone();
  document.getElementById("toggleAll").addEventListener("click",e=>{
    const all=[...document.querySelectorAll("details.work")],open=all.some(d=>!d.open);
    all.forEach(d=>d.open=open);e.target.textContent=open?"Collapse all":"Expand all";});
}

/* Ticked titles are a per-browser convenience here; in the real app they sync to the learner's account. */
const doneKey=()=>"ascent-done-"+current();
function getDone(){try{return new Set(JSON.parse(localStorage.getItem(doneKey())||"[]"))}catch(e){return new Set()}}
function saveDone(s){try{localStorage.setItem(doneKey(),JSON.stringify([...s]))}catch(e){}}
let DONE=new Set();
function paintDone(){
  DONE=getDone();
  const all=[...document.querySelectorAll("details.work[data-id]")].filter(d=>d.dataset.id);
  all.forEach(d=>{const on=DONE.has(d.dataset.id);d.classList.toggle("isdone",on);d.querySelector(".donebtn")?.setAttribute("aria-pressed",on)});
  const n=all.filter(d=>DONE.has(d.dataset.id)).length;
  const p=document.getElementById("progress");if(p)p.textContent=`${n} of ${all.length} works done`;
  document.querySelectorAll(".stagecount").forEach(sc=>{const ws=[...document.getElementById(sc.dataset.stage).querySelectorAll("details.work[data-id]")];
    sc.textContent=`${ws.filter(d=>DONE.has(d.dataset.id)).length} of ${ws.length} done`});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-done]");if(!b)return;e.preventDefault();e.stopPropagation();
  const id=b.dataset.done;DONE.has(id)?DONE.delete(id):DONE.add(id);saveDone(DONE);paintDone()});

/* In side branches and bridges, any title that is also a path on this site becomes a link to it. */
function linkPaths(root){
  const here=current();
  root.querySelectorAll(".endblock").forEach(sec=>{
    if(!/side branches|bridges/i.test(sec.querySelector("h2")?.textContent||""))return;
    sec.querySelectorAll("li, td").forEach(el=>{PATHS.forEach(([s,name])=>{if(s===here)return;
      const re=new RegExp(`\\b${name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\b`,"i");
      if(re.test(el.textContent)&&!el.querySelector(`a[href="#${s}"]`))el.innerHTML=el.innerHTML.replace(re,m=>`<a class="pathlink" href="#${s}" title="Open the ${name} path">${m}</a>`)})});
  });
}

function show(){
  const slug=current();
  document.getElementById("switch").innerHTML=PATHS.map(([s,n])=>`<a href="#${s}" ${s===slug?'aria-current="page"':""}>${n}</a>`).join("");
  document.getElementById("main").innerHTML=`<p class="status">Loading the path…</p>`;
  load(slug).then(render).then(()=>window.scrollTo(0,0)).catch(err=>{document.getElementById("main").innerHTML=`<p class="status">${err.message} Refresh the page to try again.</p>`});
}
document.addEventListener("click",e=>{const b=e.target.closest(".jump");if(b)document.getElementById(b.dataset.target)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
window.addEventListener("hashchange",show);
show();
</script>
