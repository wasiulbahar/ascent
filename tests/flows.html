<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ascent flow tests</title>
<link rel="icon" href="../icons/favicon-32.png" type="image/png">
<!--
  Click-through tests for the main learner flows, run against the real app in a frame.
  Serve the project folder (the "ascent" preview, port 8796) and open /tests/flows.html.
  Signed out only: it clears this browser's signed-out Ascent progress, and refuses to run
  if a signed-in session exists here, so it can never write to a real account.
  Result: the list below, and document.title becomes "PASS n/n" or "FAIL k/n".
-->
<style>
  body{font:15px/1.5 system-ui,sans-serif;margin:16px;background:#fff;color:#222}
  li.ok::marker{content:"✓  ";color:#1a7f37} li.no::marker{content:"✗  ";color:#c62828} li.no{color:#c62828}
  iframe{width:100%;height:520px;border:1px solid #ccc;border-radius:8px;margin-top:12px}
</style>
<h1>Ascent flow tests</h1>
<p id="summary">Running…</p>
<ol id="out"></ol>
<iframe id="app" title="App under test"></iframe>
<script type="module">
import { parsePath } from "../src/content.js?v=23";
import { PATHS } from "../src/paths.js?v=23";

const frame = document.getElementById("app"), out = document.getElementById("out");
const wait = ms => new Promise(r => setTimeout(r, ms));
const doc = () => frame.contentDocument;
async function until(fn, what, ms = 6000) {
  for (const t0 = Date.now(); Date.now() - t0 < ms; await wait(60)) { const v = fn(); if (v) return v; }
  throw new Error(`timed out waiting for ${what}`);
}
const $ = s => doc().querySelector(s), $$ = s => [...doc().querySelectorAll(s)];
const strip = s => s.replace(/<[^>]+>/g, "").replace(/[*_“”"]/g, "").replace(/\s+/g, " ").trim();
const ok = (cond, msg) => { if (!cond) throw new Error(msg); };

const paths = {};
const getPath = async slug => paths[slug] ??= parsePath(await (await fetch(`../paths/${slug}.md`, { cache: "no-store" })).text());

async function fresh(hash = "#/") {
  for (const k of Object.keys(localStorage)) if (k.startsWith("ascent-")) localStorage.removeItem(k);
  localStorage.setItem("ascent-welcomed", "1");
  const loaded = new Promise(r => frame.addEventListener("load", r, { once: true }));
  frame.src = `../index.html?test=${Date.now()}${hash}`;
  await loaded; // otherwise the old page can answer the checks below
  await until(() => doc()?.querySelector("#view")?.children.length, "the app to start", 10000);
}
async function go(hash) {
  frame.contentWindow.location.hash = hash;
  await wait(50);
  await until(() => $("#view")?.children.length && !$("#view .status")?.textContent.startsWith("Loading"), hash);
}
const stored = k => JSON.parse(localStorage.getItem(k) || "[]");

// Answer whatever quiz is showing in `box` until a result appears. want(q, stageNum) -> true for a right answer.
async function answerAll(path, want, boxSel = ".quizrun", suffix = "") {
  const qs = path.works.flatMap(w => w.quiz.map(q => ({ q, w })));
  for (let n = 0; n < 60; n++) {
    await until(() => $(".qresult") || $(`${boxSel} .qt`) || ($("[data-placement] .label") && $(".qt")), "a question or result");
    if ($(".qresult")) return $(".qresult").innerText;
    const text = strip($(".qt").innerHTML);
    const hit = qs.find(({ q }) => strip(q.q.replace(/_{3,}/, "")).slice(0, 30) === text.slice(0, 30));
    ok(hit, `question not found in the path: "${text.slice(0, 50)}"`);
    const right = want(hit.q, hit.w.stage.num);
    const opts = $$("[data-opt]");
    if (opts.length) {
      const correct = strip(hit.q.opts.find(o => o.ok).text);
      opts.find(b => (strip(b.innerHTML) === correct) === right).click();
    } else { const inp = $("#blank"); inp.value = right ? hit.q.shown + (hit.q.num !== null ? suffix : "") : "zzz"; inp.dispatchEvent(new Event("input")); }
    $("[data-check]").click();
    (await until(() => $("[data-nextq]"), "the Continue button")).click();
    await wait(30);
  }
  throw new Error("quiz never finished");
}
const certOk = () => { const c = doc().createElement("canvas").getContext("2d"); return !!c && !!$("[data-cert]")?.dataset.score; };
const chips = () => $$(".stage-card").map(c => c.querySelector(".chip")?.textContent || "open");

const TESTS = {
  async "every path page renders with all its stages"() {
    await fresh();
    for (const m of PATHS) {
      const p = await getPath(m.slug);
      await go(`#/path/${m.slug}`);
      await until(() => $("h1")?.textContent === p.title, `${m.slug} title`);
      ok($$(".stage-card").length === p.stages.length, `${m.slug}: ${$$(".stage-card").length} stage cards, expected ${p.stages.length}`);
    }
  },
  async "ticking a work saves it, and unticking removes it"() {
    await fresh("#/path/history/work/h1/get");
    (await until(() => $("[data-done]"), "tick button")).click();
    await until(() => stored("ascent-progress").includes("history:h1"), "the tick to be saved");
    await until(() => $("[data-done]")?.getAttribute("aria-pressed") === "true", "button to show ticked");
    $("[data-done]").click();
    await until(() => !stored("ascent-progress").includes("history:h1"), "the tick to be removed");
  },
  async "passing a quiz scores it and ticks the work"() {
    await fresh("#/path/history/work/h1/quiz");
    const res = await answerAll(await getPath("history"), () => true);
    ok(/4 of 4/.test(res), `result was "${res}"`);
    await until(() => stored("ascent-progress").includes("history:h1"), "the work to be ticked");
  },
  async "failing a stage, then continue anyway, opens the next stage as Not finished"() {
    await fresh();
    const p = await getPath("history");
    for (const w of p.stages[0].works) { await go(`#/path/history/work/${w.id}/quiz`); await answerAll(p, () => false); }
    await go("#/path/history/stage/1");
    ok(/haven't finished this stage/.test($(".status.warn")?.textContent || ""), "stage 1 should show the failed message");
    (await until(() => $("[data-skip='1']"), "Continue anyway")).click();
    (await until(() => $("[data-confirm='1']"), "the Are you sure step")).click();
    await go("#/path/history");
    await until(() => chips()[0] === "Not finished" && chips()[1] !== "Locked", "stage 1 Not finished and stage 2 open");
  },
  async "placement test passes Stage 1, stops at Stage 2"() {
    await fresh("#/path/history/placement");
    (await until(() => $("[data-placestart]"), "Start button")).click();
    const res = await answerAll(await getPath("history"), (q, stage) => stage === 1, "[data-placement]");
    ok(/Start at Stage 2/.test(res), `result was "${res}"`);
    await go("#/path/history");
    await until(() => chips()[0] === "Passed" && chips()[1] === "open" && chips()[2] === "Locked", `chips ${chips()}`);
    ok(!$$("a.btn").some(a => /placement/.test(a.textContent)), "placement button should hide once Stage 1 is passed");
  },
  async "number answers accept units, and -1 is not accepted as 1"() {
    await fresh("#/path/physics/work/ph6/quiz");
    ok(/4 of 4/.test(await answerAll(await getPath("physics"), () => true, ".quizrun", " m/s")), "typing units should still count");
    await go("#/path/mathematics/work/mt18/quiz");
    await until(() => $(".qt"), "the first question");
    const inp = $("#blank"); inp.value = "1"; inp.dispatchEvent(new Event("input")); $("[data-check]").click();
    await until(() => $(".qfoot.fb"), "feedback");
    ok($(".qfoot.fb.no"), "1 should be marked wrong when the answer is -1");
  },
  async "welcome tour: pick interests and level, then see picked paths"() {
    localStorage.removeItem("ascent-prefs");
    await fresh(); localStorage.removeItem("ascent-welcomed");
    const loaded = new Promise(r => frame.addEventListener("load", r, { once: true })); frame.contentWindow.location.reload(); await loaded;
    (await until(() => $("[data-tstep='1']"), "the tour to open")).click();
    await until(() => $(".climb"), "the climb card"); $("[data-tstep='1']").click();
    (await until(() => $("[data-tarea='natural-sciences']"), "interest choices")).click();
    ok($("[data-tarea='natural-sciences']").getAttribute("aria-pressed") === "true", "interest should toggle on");
    $("[data-tstep='1']").click();
    (await until(() => $("[data-tlevel='1']"), "level choices")).click();
    $("[data-tstep='1']").click();
    await until(() => $(".tpick"), "picked paths");
    const picks = $$(".tpick b").map(b => b.textContent);
    ok(picks.includes("Physics") && picks.includes("Biology"), `picks were ${picks}`);
    ok($(".tpick a[href$='/placement']"), "level 'I know a little' should offer the placement test");
    const pr = JSON.parse(localStorage.getItem("ascent-prefs"));
    ok(pr.areas.includes("natural-sciences") && pr.level === 1 && localStorage.getItem("ascent-welcomed"), "choices should be saved");
    $("button[data-close]").click();
    await go("#/collection"); await go("#/");
    await until(() => $$(".label").some(l => l.textContent === "Picked for you"), "Picked for you on the home page");
    localStorage.removeItem("ascent-prefs");
  },
  async "map of knowledge: 17 domains, search, field pages with several homes"() {
    await fresh("#/atlas");
    await until(() => $("#atlasbody [data-atlas]"), "the map");
    ok($$("#atlasbody [data-atlas]").length === 17, `17 domains, found ${$$("#atlasbody [data-atlas]").length}`);
    $("[data-atlas='d:natural-sciences']").click();
    await until(() => $("#atlasbody a[href='#/path/physics']"), "the Physics path under Natural sciences");
    const q = $("#atlasq"); q.value = "genetics"; q.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => $("#atlasbody .results mark"), "highlighted search results");
    ok($("#atlasbody .results a").getAttribute("href") === "#/field/genetics", "the exact match comes first");
    q.value = "zzqx"; q.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => /Nothing matches/.test($("#atlasbody").textContent), "the no-match message");
    await go("#/field/game-theory");
    await until(() => $("h1")?.textContent === "Game theory", "the Game theory page");
    ok($$(".homes li").length === 3, `game theory should show 3 routes, found ${$$(".homes li").length}`);
    await go("#/field/biological-sciences");
    await until(() => $("a[href='#/path/biology']"), "Biology's field page links its path");
    await go("#/area/natural-sciences");
    await until(() => $("a.card[href='#/path/physics']") && $("a.card[href='#/path/biology']"), "both natural-science paths on the domain page");
    await go("#/");
    ok($$("a.card[href^='#/area/']").length === 17, "17 domain cards on the home page");
  },
  async "points of interest: on field pages, searchable, with their own page"() {
    await fresh("#/field/physics");
    await until(() => /Points of interest \(\d+\)/.test($("#poisec")?.textContent || ""), "the points of interest on Physics");
    const total = +$("#poisec h2").textContent.match(/\((\d+)\)/)[1];
    ok(total > 50, `physics should gather many points of interest, found ${total}`);
    (await until(() => $("[data-poitype='person']"), "the People filter")).click();
    await until(() => $("[data-poitype='person'][aria-pressed='true']"), "the filter to apply");
    const q = $("#poiq"); q.value = "einstein"; q.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => $("#poisec a[href='#/poi/albert-einstein']"), "Albert Einstein in the filtered list");
    ok(doc().activeElement?.id === "poiq", "typing keeps focus in the search box");
    $("#poisec a[href='#/poi/albert-einstein']").click();
    await until(() => $("h1")?.textContent === "Albert Einstein", "Einstein's page");
    await until(() => $$(".homes li").length >= 2, "his homes");
    ok($("a[href^='https://en.wikipedia.org/wiki/Albert_Einstein']"), "a link to the Wikipedia article");
    await go("#/atlas");
    const s = await until(() => $("#atlasq"), "the map search"); s.value = "mona lisa"; s.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => $("#atlasbody a[href='#/poi/mona-lisa']"), "Mona Lisa in map search");
  },
  async "mastery: locked until every stage passes, then grand quiz and certificate"() {
    await fresh("#/path/physics/mastery");
    await until(() => /Pass every stage first/.test($("#view").textContent), "the locked message");
    ok(!$("[data-masterystart]"), "no start button while stages remain");
    localStorage.setItem("ascent-attempts", JSON.stringify([1, 2, 3, 4, 5, 6].map(n => ({ path: "physics", work_id: `placement-s${n}`, score: 4, total: 4, passed: true }))));
    const loaded = new Promise(r => frame.addEventListener("load", r, { once: true })); frame.contentWindow.location.reload(); await loaded;
    (await until(() => $("[data-masterystart]"), "the start button")).click();
    const res = await answerAll(await getPath("physics"), () => true, "[data-mastery]");
    ok(/40 of 40/.test(res), `result was "${res}"`);
    (await until(() => $("#layer [data-close]"), "the mastery celebration")).click();
    await go("#/path/physics/certificate");
    await until(() => $(".cert h1")?.textContent === "Physics", "the certificate");
    const inp = $("#certname"); inp.value = "Test Learner"; inp.dispatchEvent(new Event("input", { bubbles: true }));
    ok($(".certname").textContent === "Test Learner", "the name should update on the certificate");
    ok(certOk(), "the certificate image should draw");
    await go("#/path/physics");
    await until(() => /Certificate earned/.test($(".mastery-card")?.textContent || ""), "the mastery card to show it's earned");
    localStorage.removeItem("ascent-certname");
  },
  async "story cards: you can go back from the last card"() {
    await fresh("#/path/history/work/h1");
    (await until(() => $("[data-story]"), "the story button")).click();
    await until(() => $("#layer .story"), "the first card");
    for (let i = 0; i < 10 && $("#layer [data-step='1']"); i++) { $("#layer [data-step='1']").click(); await wait(350); }
    const before = $("#layer .story").textContent;
    ok($("#layer .linkbtn[data-step='-1']"), "the last card has a Back button");
    $("#layer .linkbtn[data-step='-1']").click(); await wait(400);
    ok($("#layer .story").textContent !== before, "Back shows the previous card");
  },
  async "settings: theme, and reset progress for one path"() {
    await fresh("#/settings");
    (await until(() => $("[data-theme-set='dark']"), "the theme choices")).click();
    await until(() => doc().documentElement.dataset.theme === "dark", "dark theme applied");
    $("[data-theme-set='system']").click();
    await until(() => !doc().documentElement.dataset.theme, "back to the device setting");
    localStorage.setItem("ascent-progress", JSON.stringify(["history:h1", "physics:ph1"]));
    localStorage.setItem("ascent-attempts", JSON.stringify([{ path: "history", work_id: "h1", score: 4, total: 4, passed: true }, { path: "physics", work_id: "ph1", score: 4, total: 4, passed: true }]));
    const loaded = new Promise(r => frame.addEventListener("load", r, { once: true })); frame.contentWindow.location.reload(); await loaded;
    (await until(() => $("#resetpath"), "the reset choice")).value = "history";
    $("[data-reset='ask']").click();
    (await until(() => $("[data-reset='yes']"), "the Are you sure step")).click();
    await until(() => !stored("ascent-progress").includes("history:h1"), "history progress cleared");
    ok(stored("ascent-progress").includes("physics:ph1"), "other paths are kept");
    ok(stored("ascent-attempts").every(a => a.path !== "history"), "history quiz scores cleared");
    localStorage.removeItem("ascent-theme");
  },
  async "search everything from the home page"() {
    await fresh("#/");
    const q = await until(() => $("#homeq"), "the home search box");
    q.value = "einstein"; $("#homesearch button").click();
    await until(() => $("#searchres a[href='#/poi/albert-einstein']"), "Einstein in the results");
    const s = $("#searchq"); s.value = "dostoevsky"; s.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => $("#searchres a[href='#/path/dostoevsky']"), "the Dostoevsky path");
    ok($$("#searchres a[href^='#/path/dostoevsky/work/']").length > 0, "his works too");
    s.value = "genetics"; s.dispatchEvent(new Event("input", { bubbles: true }));
    await until(() => $("#searchres a[href='#/field/genetics']"), "the genetics field");
  },
  async "placement questions name their work and skip lesson-only questions"() {
    await fresh("#/path/economics/placement");
    (await until(() => $("[data-placestart]"), "Start")).click();
    for (let i = 0; i < 4; i++) {
      await until(() => $(".qt"), "a question");
      ok(/^About: /.test($(".qcard .from")?.textContent || ""), "each question says which work it is about");
      ok(!/does the path|the path suggest|the task|the exercise/i.test($(".qt").textContent), `lesson-only question shown: ${$(".qt").textContent}`);
      const o = $$("[data-opt]"); if (o.length) o[0].click(); else { $("#blank").value = "x"; $("#blank").dispatchEvent(new Event("input")); }
      $("[data-check]").click(); (await until(() => $("[data-nextq]"), "Continue")).click(); await wait(80);
    }
  },
  async "paths and the map link to each other"() {
    await fresh("#/poi/fyodor-dostoevsky");
    await until(() => $("a[href='#/path/dostoevsky']"), "the Dostoevsky path on his page");
    await go("#/poi/crime-and-punishment");
    await until(() => $("a[href^='#/path/dostoevsky/work/']"), "the lesson for Crime and Punishment");
    await go("#/field/population-genetics");
    await until(() => $$(".results a[href='#/path/biology/stage/5']").length, "Covered in: Biology, Stage 5");
    await go("#/path/physics/work/ph2");
    await until(() => $(".poilinks a[href='#/poi/richard-feynman']"), "Feynman's page linked from his work");
  },
  async "starter guides on field pages, with a quick check"() {
    await fresh("#/field/virology");
    await until(() => /Starter guide/.test($("#guidesec")?.textContent || ""), "the virology guide");
    ok($$("#guidesec .guideworks li").length === 5, "five key works");
    $("[data-guidequiz]").click();
    await until(() => $("#guidequiz .qt") || $("#guidequiz .qresult"), "the quick check");
    await go("#/field/physics");
    await until(() => $("#poisec h2"), "physics page");
    ok(!$("#guidesec") || !$("#guidesec").textContent.trim(), "fields without a guide show none");
  },
  async "essays: a box under each Scholar challenge and the capstone"() {
    await fresh("#/path/history/stage/3");
    await until(() => $("[data-essay='stage-3']")?.textContent.trim(), "the essay box");
    ok(/Sign in/.test($("[data-essay='stage-3']").textContent), "signed-out visitors are asked to sign in");
    await go("#/path/history/mastery");
    await until(() => $("[data-essay='capstone']"), "the capstone box");
    ok(/Capstone essay/.test($("#view").textContent), "the capstone section");
  },
  async "a made-up certificate link is not verified"() {
    await fresh("#/verify/00000000-0000-4000-8000-000000000000");
    await until(() => /Certificate not found/.test($("#view").textContent), "the not-found message");
  },
  async "daily review: questions from passed quizzes, spaced by answers"() {
    await fresh("#/practice");
    await until(() => /Nothing to review yet/.test($("#view").textContent), "the empty state");
    localStorage.setItem("ascent-attempts", JSON.stringify([{ path: "physics", work_id: "ph1", score: 4, total: 4, passed: true }]));
    localStorage.removeItem("ascent-review");
    const loaded = new Promise(r => frame.addEventListener("load", r, { once: true })); frame.contentWindow.location.reload(); await loaded;
    await go("#/");
    await until(() => $("a.hero[href='#/practice']"), "the review card on the home page");
    await go("#/practice");
    (await until(() => $("[data-practicestart]"), "the start button")).click();
    const res = await answerAll(await getPath("physics"), () => true, "[data-practice]");
    ok(/of/.test(res), `result was ${res}`);
    const rv = JSON.parse(localStorage.getItem("ascent-review") || "{}"), keys = Object.keys(rv);
    ok(keys.length >= 3 && keys.every(k => k.startsWith("physics:ph1:")), `scheduled ${keys.length} questions from the passed work`);
    ok(keys.every(k => rv[k].b === 1 && rv[k].d > new Date().toISOString().slice(0, 10)), "right answers move to box 1 and come back later");
    ok(!stored("ascent-attempts").some(a => a.work_id === "review"), "a review session doesn't count as a quiz attempt");
    localStorage.removeItem("ascent-review");
  },
  async "explore: a timeline by century and a world map"() {
    await fresh("#/explore?view=timeline");
    await until(() => $$(".tl-row").length > 10, "century rows");
    const row = $$(".tl-row").find(b => b.querySelector(".tl-label").textContent === "19th century"); ok(row, "a 19th-century row");
    row.click();
    await until(() => $(".tl-items a[href^='#/poi/']"), "items in the 19th century");
    await go("#/explore?view=timeline&type=person");
    await until(() => $$(".tl-row").length, "people on the timeline");
    await go("#/explore?view=map");
    await until(() => $$("#mapsvg .dot").length > 100, "dots on the world map", 15000);
    $("#mapsvg .dot").dispatchEvent(new MouseEvent("click", { bubbles: true }));
    await until(() => $("#mapcard a[href^='#/poi/']"), "the card for a tapped dot");
    await go("#/field/physics");
    await until(() => $("a[href='#/explore?view=timeline&field=physics']"), "a timeline link from a field page");
  },
  async "answer options are shuffled"() {
    await fresh();
    const p = await getPath("history"), first = p.works[0].quiz[0];
    let firstIsCorrect = 0;
    for (let i = 0; i < 8; i++) {
      await go(i % 2 ? "#/path/history" : "#/path/history/work/h1/quiz");
      if (i % 2) continue;
      await until(() => $$("[data-opt]").length, "options");
      if (strip($$("[data-opt]")[0].innerHTML) === strip(first.opts.find(o => o.ok).text)) firstIsCorrect++;
    }
    ok(firstIsCorrect < 4, "the right answer came first every time");
  },
  async "the map expands a stage to show its works"() {
    await fresh("#/path/history/map");
    const before = (await until(() => $$(".tree") .length && $$(".node.wn"), "the map")).length;
    $("[data-toggle]:not([aria-expanded='true'])")?.click();
    await until(() => $$(".node.wn").length > before, "works to appear under the stage");
  },
};

(async () => {
  if (Object.keys(localStorage).some(k => k.startsWith("sb-") && k.includes("auth-token"))) {
    document.getElementById("summary").textContent = "Not run: this browser is signed in to Ascent. Use a signed-out browser, so tests never write to a real account.";
    document.title = "NOT RUN (signed in)"; return;
  }
  let pass = 0; const names = Object.keys(TESTS);
  for (const name of names) {
    const li = out.appendChild(document.createElement("li")); li.textContent = name;
    try { await TESTS[name](); li.className = "ok"; pass++; }
    catch (e) { li.className = "no"; li.textContent += ` — ${e.message}`; }
  }
  for (const k of Object.keys(localStorage)) if (k.startsWith("ascent-") && k !== "ascent-welcomed") localStorage.removeItem(k);
  const msg = pass === names.length ? `PASS ${pass}/${names.length}` : `FAIL ${names.length - pass}/${names.length}`;
  document.getElementById("summary").textContent = msg; document.title = msg;
})();
</script>
